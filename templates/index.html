<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<title>Kiểm tra từ vựng - Cambridge Audio</title>
<style>
  body { font-family: Arial, sans-serif; max-width: 700px; margin: 40px auto; padding: 0 16px; }
  h1 { font-size: 22px; }
  textarea { width: 100%; height: 220px; font-size: 16px; padding: 10px; box-sizing: border-box; }
  button { font-size: 16px; padding: 10px 24px; margin-top: 12px; cursor: pointer; }
  p.hint { color: #555; font-size: 14px; }
</style>
</head>
<body>
  <h1>Tạo bài kiểm tra từ vựng (Cambridge Dictionary)</h1>
  <p class="hint">Nhập mỗi từ/cụm từ một dòng (hoặc cách nhau bằng dấu phẩy). App sẽ tự lấy phát âm và nghĩa từ Cambridge Dictionary.</p>
  <form action="/generate" method="post">
    <textarea name="words" placeholder="ví dụ:&#10;apple&#10;beautiful&#10;determine">example
important
develop</textarea>
    <br>
    <button type="submit">Tạo bài kiểm tra</button>
  </form>
</body>
</html>
